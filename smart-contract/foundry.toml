[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# via_ir stays off: every contract is well inside the size limit with the legacy pipeline.
via_ir = false
# The bootstrap scripts read the legacy export from here.
fs_permissions = [{ access = "read", path = "./data" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[invariant]
runs = 64
depth = 64
fail_on_revert = true

[rpc_endpoints]
base_sepolia = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
base_mainnet = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }
base_mainnet = { key = "${BASESCAN_API_KEY}", chain = 8453, url = "https://api.basescan.org/api" }

[lint]
# s_ prefix for storage variables is the project convention (see CLAUDE.md).
# block.timestamp is allowed for durations and windows, never for access control.
# Bounded loops that revert or call trusted contracts are intentional; see the gas tests.
exclude_lints = ["mixed-case-variable", "block-timestamp", "require-revert-in-loop", "calls-loop"]
