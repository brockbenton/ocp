name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  contract:
    name: Smart contract (forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-contract
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # lib/ is gitignored (not vendored), so fetch the pinned dependencies that
      # foundry.toml's remappings expect.
      - name: Install contract dependencies
        run: |
          rm -rf lib && mkdir -p lib
          git clone --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          git clone --depth 1 --branch v1.9.4 https://github.com/foundry-rs/forge-std.git lib/forge-std
      - run: forge --version
      - run: forge test -vvv
      # Fails if any deployable contract exceeds the 24,576-byte EIP-170 limit.
      - name: Bytecode size budget
        run: forge build --sizes --skip test --skip script

  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ocp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ocp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  e2e:
    name: End to end (contracts + backend on anvil)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ocp_test_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ocp_test
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install contract dependencies
        working-directory: smart-contract
        run: |
          rm -rf lib && mkdir -p lib
          git clone --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          git clone --depth 1 --branch v1.9.4 https://github.com/foundry-rs/forge-std.git lib/forge-std
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - name: Check generated ABIs match the contracts
        run: |
          (cd smart-contract && forge build)
          cd backend && npx tsx scripts/sync-abi.ts --check
      - run: npm run test:e2e
        working-directory: backend

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Placeholder: next.config.mjs requires it, and CI never talks to Privy.
          NEXT_PUBLIC_PRIVY_APP_ID: clci000000000000000000000
          NEXT_PUBLIC_CONTRACT_ADDRESS: '0x0000000000000000000000000000000000000001'
